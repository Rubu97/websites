    <line x1="48" y1="17" x2="48" y2="23"/>
    <line x1="34" y1="21" x2="37" y2="26"/>
    <line x1="62" y1="21" x2="59" y2="26"/>
    <line x1="25" y1="30" x2="29.5" y2="33.5"/>
    <line x1="71" y1="30" x2="66.5" y2="33.5"/>
  </g>
  <circle cx="48" cy="33" r="6.5" fill="url(#gold)"/>
  <!-- open book -->
  <g>
    <path d="M48 47 C42 43 33 42 26 44 L26 64 C33 62 42 63 48 67 Z"
